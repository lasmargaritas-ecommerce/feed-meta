name: Feed Meta
on:
  schedule: [{ cron: '7 * * * *' }]   # cada hora, minuto 7 (UTC)
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: feed, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node generate.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - uses: actions/deploy-pages@v4
      # Una vez por día guarda el reporte en el repo (mantiene activo el cron: GitHub lo apaga tras 60 días sin actividad)
      - if: github.event.schedule && format('{0}', github.run_attempt) == '1'
        run: |
          if [ "$(date -u +%H)" = "06" ]; then
            git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
            cp public/report.json report-diario.json && git add report-diario.json
            git commit -m "reporte diario $(date -u +%F)" && git push || true
          fi
